<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>扫码玩 · 合成神龙</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(circle at 50% 30%, #0d4a6b, #062538 70%);
    color: #eaf6ff; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 24px; text-align: center;
  }
  h1 { font-size: 24px; letter-spacing: 2px; }
  .qr {
    width: 260px; height: 260px; padding: 14px; border-radius: 18px;
    background: #fff; box-shadow: 0 12px 40px rgba(0, 0, 0, .45);
    display: flex; align-items: center; justify-content: center;
  }
  .qr img { width: 100%; height: 100%; display: block; }
  .url {
    font-size: 15px; font-weight: 700; color: #ffd75c;
    background: rgba(0, 0, 0, .3); padding: 8px 16px; border-radius: 10px;
    user-select: all; cursor: pointer;
  }
  .hint { font-size: 13px; color: rgba(234, 246, 255, .6); line-height: 1.7; }
  .ips { font-size: 13px; color: rgba(234, 246, 255, .75); line-height: 1.9; }
  .ips b { color: #7ef7d1; }
  a { color: #7ef7d1; }
</style>
</head>
<body>
  <h1>扫一扫，手机上玩</h1>
  <div class="qr"><img id="qr" alt="二维码"></div>
  <div class="url" id="url" title="点击复制"></div>
  <div class="ips" id="ips"></div>
  <p class="hint">
    手机与电脑需连同一个 WiFi。<br>
    二维码扫不出来时，就在手机浏览器里手动输入上面的地址。
  </p>
  <p class="hint"><a href="./index.html">→ 直接在电脑上玩</a></p>

<script>
  // 端口跟着当前页面走，保证二维码里的端口就是服务器真实端口
  var port = location.port || '8080';
  // 优先用非内网地址（局域网 IP）
  var url = 'http://' + location.hostname + (port ? ':' + port : '') + '/';
  document.getElementById('url').textContent = url;
  document.getElementById('url').onclick = function () {
    navigator.clipboard && navigator.clipboard.writeText(url);
  };
  // 在线接口生成二维码；断网时降级为纯文本提示
  var img = document.getElementById('qr');
  img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=420x420&margin=0&data=' + encodeURIComponent(url);
  img.onerror = function () {
    img.style.display = 'none';
    img.parentNode.innerHTML = '<span style="color:#062538;font-size:13px">无法联网生成二维码<br>请手动输入上方地址</span>';
  };
  fetch('/qr-ips.json')
    .then(function (r) { return r.json(); })
    .then(function (list) {
      if (!list || !list.length) return;
      document.getElementById('ips').innerHTML =
        '可用的局域网地址：<br>' + list.map(function (ip) {
          return '<b>http://' + ip + ':' + port + '</b>';
        }).join('<br>');
    })
    .catch(function () {});
</script>
</body>
</html>
